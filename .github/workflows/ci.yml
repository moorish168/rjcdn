name: CI

on:
  push:
    # branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create from the current commit (e.g. v0.1.0)"
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fresh runners: incremental artifacts add restore cost without helping first build.
  CARGO_INCREMENTAL: "0"

jobs:
  # Host/glibc tests only — no musl toolchain. Runs in parallel with release build.
  backend-test:
    name: Backend (test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lagran
          POSTGRES_PASSWORD: lagran
          POSTGRES_DB: lagran_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://lagran:lagran@127.0.0.1:5432/lagran_test
      REQUIRE_TEST_DATABASE: "1"
      # Faster test compiles: no full debuginfo.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Install mold
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-host
      - name: Unit and integration tests
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo test --workspace --locked

  # Static musl release binaries — parallel with tests; own cache key.
  backend-build:
    name: Backend (release musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-musl
          prefix-key: v1-musl
      - name: Release build (static musl)
        env:
          LAGRAN_GIT_HASH: ${{ github.sha }}
          LAGRAN_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p control -p edge -p lagran-dns
      - name: Verify static binaries
        run: |
          set -euo pipefail
          for bin in lagran-control lagran-edge lagran-dns; do
            file "target/x86_64-unknown-linux-musl/release/${bin}"
            ldd "target/x86_64-unknown-linux-musl/release/${bin}" 2>&1 || true
          done
          # The console's 「图片自动 WebP」 switch does nothing unless libwebp is
          # compiled in (edge feature `image-webp`, on by default).
          edge_version="$(target/x86_64-unknown-linux-musl/release/lagran-edge version)"
          echo "${edge_version}"
          grep -q 'features:.*image-webp' <<<"${edge_version}"
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: lagran-binaries
          if-no-files-found: error
          path: |
            target/x86_64-unknown-linux-musl/release/lagran-control
            target/x86_64-unknown-linux-musl/release/lagran-edge
            target/x86_64-unknown-linux-musl/release/lagran-dns

  frontend:
    name: Frontend (static generate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install
        working-directory: apps/frontend
        run: npm ci
      - name: Generate
        working-directory: apps/frontend
        run: npm run generate
      - name: Upload web
        uses: actions/upload-artifact@v4
        with:
          name: lagran-web
          if-no-files-found: error
          path: apps/frontend/.output/public

  # Always build a downloadable bundle on branch pushes and PRs. This is the
  # job users see as "Release bundle artifact"; it is deliberately not gated
  # on a tag.
  bundle:
    name: Release bundle artifact
    needs: [backend-test, backend-build, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Build bundle
        id: bundle
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG:-}" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="snapshot-${GITHUB_SHA::7}"
          fi
          VERSION="${TAG#v}"
          if [[ "${TAG}" != snapshot-* && ! "${TAG}" =~ ^v[0-9] ]]; then
            echo "error: release tag must look like v1.2.3 (got ${TAG})" >&2
            exit 1
          fi
          mkdir -p stage/bin stage/web stage/data/maxmind
          cp dist/lagran-binaries/lagran-control stage/bin/
          cp dist/lagran-binaries/lagran-edge stage/bin/
          cp dist/lagran-binaries/lagran-dns stage/bin/
          cp -a dist/lagran-web/. stage/web/
          # `actions/download-artifact` does not restore the file modes the job
          # uploaded: the SPA lands as 0600/0700 owned by the runner. Packaging
          # that as-is shipped a tarball whose web root only root could read, and
          # the reverse proxy serving it answered 403 after an upgrade. Normalise
          # the modes here so the archive is correct regardless of how the
          # installer copies it.
          chmod -R a+rX stage/web
          # Ship GeoLite2-Country so first-boot Smart DNS works offline; install.sh
          # copies it to /var/lib/lagran/maxmind/. Refresh later via the console.
          curl -fsSL --retry 3 \
            'https://raw.githubusercontent.com/wp-statistics/GeoLite2-Country/master/GeoLite2-Country.mmdb.gz' \
            | gzip -dc > stage/data/maxmind/GeoLite2-Country.mmdb
          test -s stage/data/maxmind/GeoLite2-Country.mmdb
          cp control.env.example edge.env.example dns.env.example install.sh update.sh edge-update.sh LICENSE stage/
          printf '%s\n' "${TAG}" > stage/VERSION
          tar -C stage -czf "lagran-cdn-${VERSION}-linux-amd64.tar.gz" .
          sha256sum "lagran-cdn-${VERSION}-linux-amd64.tar.gz" > SHA256SUMS
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: lagran-release-bundle
          if-no-files-found: error
          path: |
            lagran-cdn-*.tar.gz
            SHA256SUMS

  # Publishing is intentionally tag-only (or a manual dispatch with a tag).
  # A plain branch push must not create an unreviewed GitHub Release.
  publish:
    name: Publish GitHub Release (tag/manual)
    needs: [bundle]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lagran-release-bundle
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          files: dist/*
          generate_release_notes: true
